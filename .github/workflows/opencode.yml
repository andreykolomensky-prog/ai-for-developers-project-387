name: opencode

# Интерактивный агент: отвечает на команду /oc или /opencode в комментарии
# к issue, к pull request или к строке diff.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

# Для одного issue или PR одновременно работает один запуск. Следующая команда
# ждёт очереди и не обрывает начатую работу.
concurrency:
  group: opencode-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  opencode:
    # Модель вызывается только по команде в тексте, от доверенного участника
    # и не в ответ на сообщение бота. PR из fork секрет модели не получают.
    if: >-
      github.event.comment.user.type != 'Bot' &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) &&
      (contains(github.event.comment.body, '/oc') || contains(github.event.comment.body, '/opencode')) &&
      (github.event_name != 'pull_request_review_comment' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      # Чтение кода. Комментарии, ветки и PR агент создаёт токеном приложения OpenCode,
      # который получает в обмен на OIDC-токен.
      contents: read
      id-token: write
      # Скиллы to-spec и to-tickets публикуют спецификацию и тикеты командой gh с GH_TOKEN.
      issues: write
      pull-requests: read
    steps:
      - name: Проверить, что PR открыт из ветки этого репозитория
        if: github.event_name == 'issue_comment' && github.event.issue.pull_request
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          cross=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json isCrossRepository --jq .isCrossRepository)
          if [ "$cross" != "false" ]; then
            echo "::error::PR открыт из fork: агент с секретом модели для него не запускается"
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Те же версии инструментов, что и локально: агент запускает проверки командой mise run check.
      - uses: jdx/mise-action@v5
        with:
          version: 2026.11.7

      - uses: ./.github/actions/setup-opencode

      # Та же команда, которую выполняет action anomalyco/opencode/github.
      - name: Запустить OpenCode
        run: opencode github run
        env:
          MODEL: opencode/deepseek-v4.1-flash
          MENTIONS: /opencode,/oc
          # Репозиторий публичный: сессии агента наружу не публикуются.
          SHARE: 'false'
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
